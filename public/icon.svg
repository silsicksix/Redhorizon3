<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#991b1b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark HUD Background with rounded aesthetic -->
  <rect width="512" height="512" rx="100" fill="#09090b"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ef4444" stroke-width="6" stroke-opacity="0.3" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ef4444" stroke-width="4" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="url(#grad)" filter="url(#glow)"/>
  <!-- Crosshairs / Radar -->
  <line x1="256" y1="36" x2="256" y2="476" stroke="#f87171" stroke-width="3" stroke-opacity="0.4"/>
  <line x1="36" y1="256" x2="476" y2="256" stroke="#f87171" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Central Horizon / Eye Reticle -->
  <circle cx="256" cy="256" r="48" fill="#09090b" stroke="#f87171" stroke-width="6"/>
  <circle cx="256" cy="256" r="20" fill="#ef4444"/>
  <!-- OSINT Nodes -->
  <circle cx="180" cy="180" r="14" fill="#38bdf8"/>
  <circle cx="332" cy="180" r="14" fill="#38bdf8"/>
  <circle cx="340" cy="330" r="14" fill="#38bdf8"/>
  <circle cx="172" cy="330" r="14" fill="#38bdf8"/>
  <!-- Connecting Links -->
  <line x1="180" y1="180" x2="256" y2="256" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="332" y1="180" x2="256" y2="256" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="340" y1="330" x2="256" y2="256" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="172" y1="330" x2="256" y2="256" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7"/>
</svg>